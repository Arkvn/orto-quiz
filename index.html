<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ортопедия: тренажёр тестов</title>
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef3f1; --text:#16211d; --muted:#5b6b65; --line:#d9e2de;
  --accent:#0f6e63; --accent-ink:#ffffff; --accent-soft:#dcefea;
  --ok:#17803d; --ok-soft:#e1f4e7; --bad:#b42318; --bad-soft:#fde8e6; --warn:#a15c07; --warn-soft:#fdf1dc;
  --info:#285a8f; --info-soft:#e4eefa; --on-solid:#ffffff; --shadow:0 1px 2px rgba(16,33,29,.06),0 4px 14px rgba(16,33,29,.06);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1513; --surface:#18211e; --surface-2:#1f2a26; --text:#e7efec; --muted:#9db0a9; --line:#2c3a35;
    --accent:#3fb8a6; --accent-ink:#06201b; --accent-soft:#163a34;
    --ok:#4cc276; --ok-soft:#14301f; --bad:#ff7b6e; --bad-soft:#3a1714; --warn:#f0b35a; --warn-soft:#352610;
    --info:#7fb2ec; --info-soft:#14263a; --on-solid:#0f1513; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:1.45rem;line-height:1.25;margin:8px 0 4px}
h2{font-size:1.1rem;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.stat{padding:12px;text-align:center}
.stat b{display:block;font-size:1.35rem;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;
  min-height:48px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
.btn small{color:var(--muted);font-size:.8rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary small{color:inherit;opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topics{display:grid;gap:10px}
.topic{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding:14px;cursor:pointer;text-align:left;width:100%}
.topic .lbl{font-size:.78rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.topic .ttl{font-weight:600;line-height:1.3}
.topic .meta{font-size:.82rem;color:var(--muted);text-align:right;white-space:nowrap}
.bar{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0}
.settings{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;color:var(--muted);font-size:.9rem}
.settings label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
.settings input{width:18px;height:18px;accent-color:var(--accent)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:.85rem}
/* quiz */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;margin:-16px 0 8px}
.topbar-row{display:flex;align-items:center;gap:10px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;height:40px;cursor:pointer;padding:0 12px}
.progress{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:56px;text-align:right}
.qcard{padding:18px}
.qmeta{font-size:.8rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--surface-2);font-size:.75rem}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.08rem;font-weight:600;line-height:1.4;margin:0 0 6px}
.hint{font-size:.85rem;color:var(--muted);margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr auto;align-items:start;gap:10px;width:100%;text-align:left;padding:12px;
  border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;min-height:48px;line-height:1.4}
.opt .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:600;
  background:var(--surface-2);color:var(--muted)}
.opt.multi .num{border-radius:8px}
.opt .mark{font-weight:700;font-size:.9rem;align-self:center}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .num{background:var(--ok);color:var(--on-solid)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .num{background:var(--bad);color:var(--on-solid)}
.opt.wrong .mark{color:var(--bad)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt.missed .mark{color:var(--ok)}
.opt.suggest{box-shadow:inset 0 0 0 2px var(--warn)}
.feedback{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface-2)}
.verdict{font-weight:700;margin:0 0 6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.part{color:var(--warn)}
.ex{margin:0}
.flag{margin-top:12px;padding:12px;border-radius:12px;font-size:.93rem}
.flag.dispute{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.flag.note{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.flag b{display:block;margin-bottom:4px}
.flag.dispute b{color:var(--warn)} .flag.note b{color:var(--info)}
.flag p{margin:0}
.flag .sug{margin-top:6px;font-weight:600}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bottom .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.bottom .btn{flex:1;align-items:center;text-align:center;font-weight:600}
/* results */
.score{padding:20px;text-align:center}
.score .big{font-size:2.6rem;font-weight:700;line-height:1.1;color:var(--accent)}
.score p{margin:6px 0 0;color:var(--muted)}
.mistake{padding:14px;margin-top:10px}
.mistake .q{font-weight:600;margin:0 0 6px}
.mistake .row{font-size:.9rem;margin:2px 0}
.mistake .row span{color:var(--muted)}
details{margin-top:6px} summary{cursor:pointer;color:var(--accent);font-size:.9rem}
/* reference */
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;min-height:48px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ref{padding:14px;margin-top:10px}
.ref .q{font-weight:600;margin:0 0 8px}
.ref ol{margin:0;padding-left:22px}
.ref li{margin:2px 0;color:var(--muted)}
.ref li.k{color:var(--ok);font-weight:600}
.ref li.k::marker{color:var(--ok)}
.ref .ex{margin-top:8px;font-size:.92rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.footnote{margin-top:28px;font-size:.8rem;color:var(--muted)}
@media (max-width:480px){
  .actions{grid-template-columns:1fr}
  h1{font-size:1.3rem}
  .qcard{padding:14px}
}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="bottom" id="bottom" hidden><div class="in" id="bottom-in"></div></div>
<script type="application/json" id="data">{"topics":[{"id":1,"label":"Тема 1","title":"Штифтовые конструкции и вкладки","count":20},{"id":2,"label":"Тема 2","title":"Искусственная культя со штифтом","count":20},{"id":3,"label":"Тема 3","title":"Этиология и клиника частичной потери зубов","count":20},{"id":4,"label":"Тема 5","title":"Мостовидные протезы","count":20},{"id":5,"label":"Тема 6","title":"Штампованно-паяные мостовидные протезы","count":20},{"id":6,"label":"Тема 8","title":"Комбинированные протезы: металлокерамика и металлопластмасса","count":20},{"id":7,"label":"Тема 9","title":"Керамические протезы","count":20},{"id":8,"label":"Осложнения","title":"Ошибки и осложнения при протезировании","count":20}],"questions":[{"id":"t1-1","topic":1,"n":1,"q":"Показание к протезированию искусственной культей, если:","opts":["зуб депульпирован более года назад","канал корня запломбирован до верхушки","зуб имеет здоровые периапикальные ткани","коронка зуба разрушена на 1/2 и более"],"key":[4],"multi":false,"ex":"Искусственная культя показана, когда коронка разрушена на 1/2 и более: оставшихся тканей уже недостаточно, чтобы удержать коронку. Варианты 1–3 — это условия (требования к корню), а не показание."},{"id":"t1-2","topic":1,"n":2,"q":"Перелом коронки зуба на уровне с краем десны является показанием к протезированию:","opts":["искусственной коронкой","вкладкой","мостовидным протезом","штифтовой конструкцией"],"key":[4],"multi":false,"ex":"Перелом на уровне десны — коронковой части практически нет, коронку не на что зафиксировать. Нужна внутриканальная опора — штифтовая конструкция."},{"id":"t1-3","topic":1,"n":3,"q":"Штифтовая культевая вкладка может быть изготовлена только:","opts":["на однокорневые зубы верхней и нижней челюстей","резцы, клыки и премоляры верхней челюсти","резцы, клыки и премоляры нижней челюсти","зубы любой группы"],"key":[4],"multi":false,"ex":"Культевую штифтовую вкладку можно сделать на зуб любой группы. На многокорневые зубы изготавливают разборную вкладку с несколькими штифтами в непараллельных каналах."},{"id":"t1-4","topic":1,"n":4,"q":"При полном разрушении коронковой части центрального резца верхней челюсти наиболее рациональная конструкция протеза:","opts":["штифтовый зуб по Ричмонду","коронка со штифтом по Ахмедову","культевая штифтовая вкладка с искусственной коронкой"],"key":[2],"multi":false,"ex":"Засчитывается ответ по ключу кафедры. Почему он спорен и какой вариант, вероятно, верен — в замечании ниже.","flag":{"kind":"dispute","suggest":[3],"text":"По современным представлениям наиболее рациональна культевая штифтовая вкладка с искусственной коронкой (вариант 3): коронку можно снять и заменить, не трогая штифт (см. тему 2, вопрос 20). Конструкции Ричмонда и Ахмедова — цельные штифтовые зубы, сегодня применяются редко."}},{"id":"t1-5","topic":1,"n":5,"q":"Штифт штифтового зуба по Ричмонду изготавливается:","opts":["из 950-й пробы золота с платиновой лигатурой","750-й пробы золота с платиновой лигатурой","365-й пробы серебра с золотой лигатурой","565-й пробы золота с серебряной лигатурой","никель-хромового сплава","серебряно-палладиевого сплава"],"key":[2],"multi":false,"ex":"Штифт должен быть прочным на изгиб, поэтому его делают из золота 750-й пробы с платиновой лигатурой (а также из нержавеющей стали или КХС). Высокопробное золото (900–950) слишком мягкое."},{"id":"t1-6","topic":1,"n":6,"q":"Штифтовой зуб с вкладкой (по автору):","opts":["Логана","Ричмонда","Ахметова","Дэвиса","Ильиной–Маркосян"],"key":[5],"multi":false,"ex":"Штифтовой зуб с вкладкой — конструкция Ильиной–Маркосян: штифт + вкладка в устье канала + коронка. Логан — фарфоровая коронка со штифтом, Ричмонд — с наружным кольцом (колпачком), Ахмедов — с защитной пластинкой. («Ахметова» в варианте 3 — опечатка исходника, автор — Ахмедов.)"},{"id":"t1-7","topic":1,"n":7,"q":"Прямой способ моделирования культевой штифтовой вкладки:","opts":["вкладка моделируется в полости рта пациента","вкладка моделируется на гипсовой модели"],"key":[1],"multi":false,"ex":"Прямой способ — воск моделируют непосредственно в полости рта (в канале корня). Непрямой — техник моделирует на гипсовой модели."},{"id":"t1-8","topic":1,"n":8,"q":"При значительном разрушении зубов показаны:","opts":["металлические штампованные коронки","литые коронки","коронки на искусственной культе со штифтом","комбинированные коронки","мостовидные протезы"],"key":[3],"multi":false,"ex":"При значительном разрушении опоры для обычной коронки недостаточно — коронку изготавливают на искусственной культе со штифтом."},{"id":"t1-9","topic":1,"n":9,"q":"При протезировании штифтовыми конструкциями длина штифта должна быть:","opts":["равна 1/2 длины корня зуба","равна 2/3 длины корня зуба","равна всей длине корня","меньше высоты будущей искусственной коронки"],"key":[2],"multi":false,"ex":"Оптимальная длина штифта — 2/3 длины корня и не меньше высоты будущей коронки. В апикальной части сохраняют пломбу для герметичности канала."},{"id":"t1-10","topic":1,"n":10,"q":"Культевыми вкладками можно протезировать:","opts":["резцы","резцы и клыки","резцы, клыки и премоляры","резцы, клыки, премоляры и моляры"],"key":[4],"multi":false,"ex":"Культевые вкладки применимы на всех группах зубов; на молярах — разборные, с несколькими штифтами."},{"id":"t1-11","topic":1,"n":11,"q":"При изготовлении штифтовых конструкций толщина стенок корня зуба должна быть не менее:","opts":["0,5 мм","1,0 мм","2,0 мм","2,5 мм"],"key":[2],"multi":false,"ex":"Стенки корня должны быть толщиной не менее 1 мм — более тонкие раскалываются под нагрузкой."},{"id":"t1-12","topic":1,"n":12,"q":"При индексе разрушения окклюзионной поверхности зуба по В.Ю. Миликевичу (ИРОПЗ) = 0,8 показано лечение:","opts":["штифтовой конструкцией","пломбой","вкладкой","искусственной коронкой"],"key":[1],"multi":false,"ex":"Засчитывается ответ по ключу кафедры. Почему он спорен и какой вариант, вероятно, верен — в замечании ниже.","flag":{"kind":"dispute","suggest":[4],"text":"По Миликевичу: 0,55–0,6 — вкладка; 0,6–0,8 — пломба или искусственная коронка; больше 0,8 — штифтовая конструкция. Значение 0,8 граничное и формально ещё относится к коронкам — поэтому ИИ и предложил вариант 4. Ключ относит его к штифтовым конструкциям. На экзамене отвечайте по ключу, но знайте границы."}},{"id":"t1-13","topic":1,"n":13,"q":"Для ортопедического лечения дефектов твердых тканей зубов применяются:","opts":["вкладки","полукоронки","коронки","штифтовые конструкции","пломбы"],"key":[1,2,3,4],"multi":true,"ex":"Вкладки, полукоронки, коронки и штифтовые конструкции — ортопедические методы. Пломба относится к терапевтической стоматологии."},{"id":"t1-14","topic":1,"n":14,"q":"При протезировании штифтовыми зубами возможны следующие ошибки и осложнения:","opts":["выбор конструкции штифтового зуба не по показаниям","перфорация стенки корня зуба","недостаточная длина штифта","раскол корня","изменение цвета корня зуба","аллергические реакции"],"key":[1,2,3,4],"multi":true,"ex":"Типичные ошибки: неверный выбор конструкции, перфорация стенки корня при расширении канала, короткий штифт (расцементировка, перелом), раскол корня (толстый или длинный штифт, тонкие стенки)."},{"id":"t1-15","topic":1,"n":15,"q":"К корням зубов, протезируемых штифтовыми конструкциями, предъявляются требования:","opts":["канал корня зуба должен быть проходим на глубину не менее высоты будущей искусственной коронки","стенки корня должны быть плотными","околоверхушечная часть канала корня должна быть запломбирована до физиологической верхушки","стенки корня должны иметь достаточную толщину (не менее 1 мм)","стенки корня должны быть тонкими","в околоверхушечной части канала корня должно быть рыхлое пломбирование"],"key":[1,2,3,4],"multi":true,"ex":"Канал проходим на глубину не меньше высоты коронки, стенки плотные и толщиной ≥ 1 мм, пломба герметична до физиологической верхушки. Тонкие стенки и рыхлое пломбирование — противопоказания."},{"id":"t1-16","topic":1,"n":16,"q":"Классический штифтовый зуб Ричмонда в своей конструкции не имеет:","opts":["наружное кольцо","защитную пластинку","вкладку"],"key":[2,3],"multi":true,"ex":"Зуб Ричмонда — колпачок с наружным кольцом и крышкой, спаянный со штифтом, плюс литое ложе с фасеткой. Вкладки у него нет (это признак зуба Ильиной–Маркосян), а «защитная пластинка» — элемент штифтового зуба Ахмедова.","flag":{"kind":"note","suggest":null,"text":"Часть руководств называет крышку колпачка Ричмонда «защитной пластинкой» — тогда верным был бы только вариант 3. Ключ кафедры: 2 и 3."}},{"id":"t1-17","topic":1,"n":17,"q":"Полное разрушение коронковой части зуба возможно вследствие:","opts":["травмы","повышенной стираемости","пародонтоза","пародонтита","перелома коронки зуба при обширном кариесе"],"key":[1,2,5],"multi":true,"ex":"Коронка полностью разрушается при травме, повышенной стираемости и обширном кариесе. Пародонтоз и пародонтит поражают опорные ткани зуба, а не коронку."},{"id":"t1-18","topic":1,"n":18,"q":"При полном разрушении коронки зуба показано протезирование:","opts":["искусственной коронкой с опорой на искусственную культю со штифтом","искусственной штампованной коронкой","металлокерамической коронкой","штифтовым зубом Ильиной–Маркосян","штифтовым зубом Копейкина"],"key":[1,4],"multi":true,"ex":"При полном разрушении коронки нужна внутрикорневая опора: коронка на культе со штифтом или штифтовой зуб (Ильиной–Маркосян). Штампованная или металлокерамическая коронка без культи держаться не будет."},{"id":"t1-19","topic":1,"n":19,"q":"Вкладки при протезировании мостовидными протезами используются:","opts":["для восстановления дефекта коронки зуба","восполнения дефекта зубного ряда","фиксации консольного протеза","опоры мостовидных протезов","предупреждения дальнейшего патологического стирания зубных тканей"],"key":[1,4],"multi":true,"ex":"Вкладка восстанавливает дефект коронки и может быть опорой мостовидного протеза. Дефект зубного ряда замещает тело моста, а не вкладка."},{"id":"t1-20","topic":1,"n":20,"q":"К микропротезам относятся:","opts":["вкладки","виниры","полукоронки","коронки","штифтовые зубы"],"key":[1,2,3],"multi":true,"ex":"Микропротезы восстанавливают часть коронки: вкладки, виниры, полукоронки. Коронка и штифтовой зуб замещают коронку целиком."},{"id":"t2-1","topic":2,"n":1,"q":"При прямом методе восковая модель будущей вкладки изготавливается:","opts":["непосредственно в полости рта","на модели из супергипса","модели из серебряной амальгамы"],"key":[1],"multi":false,"ex":"Прямой метод — восковую модель изготавливают непосредственно в полости рта."},{"id":"t2-2","topic":2,"n":2,"q":"Для двойного слепка используются слепочные массы:","opts":["твердокристаллические","силиконовые","альгинатные","термопластические"],"key":[2],"multi":false,"ex":"Двойной (двухслойный) оттиск получают силиконами: базовый слой высокой вязкости + текучий корригирующий слой."},{"id":"t2-3","topic":2,"n":3,"q":"На искусственную культю со штифтом можно изготовить коронку только:","opts":["штампованную","литую","пластмассовую","литую с облицовкой (комбинированную)","любую"],"key":[5],"multi":false,"ex":"Культя повторяет форму препарированного зуба, поэтому на неё можно сделать коронку любого вида."},{"id":"t2-4","topic":2,"n":4,"q":"Противопоказания к протезированию культевыми штифтовыми вкладками:","opts":["сохранившийся устойчивый корень при разрушенной коронковой части зуба","подвижный корень","разрушенная на 2/3 коронковая часть зуба"],"key":[2],"multi":false,"ex":"Подвижный корень не выдержит нагрузку — это противопоказание. Устойчивый корень и разрушение коронки на 2/3, наоборот, — показания."},{"id":"t2-5","topic":2,"n":5,"q":"Метод изготовления вкладки зубным техником на модели:","opts":["прямой","непрямой","параллельный"],"key":[2],"multi":false,"ex":"Непрямой метод — модель вкладки изготавливает техник на гипсовой модели по оттиску."},{"id":"t2-6","topic":2,"n":6,"q":"Изолирующая жидкость, применяемая при моделировании вкладок воском на модели:","opts":["«Изокол»","«Пико-сеп»","«Изолак»"],"key":[2],"multi":false,"ex":"«Пико-сеп» — изолирующая жидкость для моделирования воском на гипсовых штампиках. «Изокол» изолирует гипс при работе с пластмассой."},{"id":"t2-7","topic":2,"n":7,"q":"Какой отбел используют для вкладок из золотосодержащего сплава?","opts":["96% спирт","40% серная кислота","30% соляная кислота"],"key":[3],"multi":false,"ex":"Окалину с отливок из золотых сплавов удаляют (отбеливают) в 30 % растворе соляной кислоты."},{"id":"t2-8","topic":2,"n":8,"q":"Воск для моделирования культевых вкладок:","opts":["«Пчелиный»","«Лавакс»","«Базисный»"],"key":[2],"multi":false,"ex":"«Лавакс» — твёрдый моделировочный воск для вкладок: даёт чёткие края и сгорает без остатка. Пчелиный и базисный воски для этого не подходят."},{"id":"t2-9","topic":2,"n":9,"q":"Стандартные заготовки фарфоровых коронок разных цветов со штифтами различных размеров получили название коронок:","opts":["Дювеля","Копейкина","Логана","Гаврилова"],"key":[3],"multi":false,"ex":"Коронки Логана — стандартные фарфоровые коронки с готовым штифтом."},{"id":"t2-10","topic":2,"n":10,"q":"Перед снятием двухслойного оттиска ретракция десны необходима, чтобы:","opts":["получить точный отпечаток поддесневой части зуба","получить точный отпечаток наддесневой части зуба","остановить кровотечение"],"key":[1],"multi":false,"ex":"Ретракция раскрывает десневую бороздку, чтобы оттискная масса отобразила уступ и поддесневую часть зуба."},{"id":"t2-11","topic":2,"n":11,"q":"Способы получения оттисков при протезировании вкладками непрямым методом:","opts":["анатомический","двойной","функциональный","компрессионный"],"key":[2],"multi":false,"ex":"Для вкладок непрямым методом получают двойной (двухслойный) оттиск — он точно отображает полость."},{"id":"t2-12","topic":2,"n":12,"q":"Для снятия слепков при изготовлении вкладки применяются материалы:","opts":["гипс","альгинатные","силиконовые","цинкэвгеноловые"],"key":[3],"multi":false,"ex":"Для вкладок нужна высокая точность — силиконовые материалы. Альгинаты и гипс для этого недостаточно точны."},{"id":"t2-13","topic":2,"n":13,"q":"Металлические культевые штифтовые вкладки полируют:","opts":["до укрепления в зубе цементом","после укрепления в зубе цементом","не полируют"],"key":[3],"multi":false,"ex":"Культевую вкладку не полируют: шероховатая поверхность лучше удерживает цемент под коронкой."},{"id":"t2-14","topic":2,"n":14,"q":"При протезировании штифтовыми культевыми вкладками длина штифта относительно длины корня составляет:","opts":["1/3","½","2/3","всю длину корня","длина штифта не имеет значения"],"key":[3],"multi":false,"ex":"Штифт — 2/3 длины корня (см. тему 1, вопрос 9)."},{"id":"t2-15","topic":2,"n":15,"q":"Индекс разрушения окклюзионной поверхности зуба, равный 0,9, является показанием к изготовлению:","opts":["штифтовой конструкции","вкладки","полукоронки","экваторной коронки"],"key":[1],"multi":false,"ex":"ИРОПЗ больше 0,8 — показание к штифтовой конструкции (Миликевич)."},{"id":"t2-16","topic":2,"n":16,"q":"Для постоянной фиксации искусственной культи со штифтом используют:","opts":["водный дентин","поликарбоксилатный цемент","«Темп Бонд»","«Акрилоксид»","стеклоиономерные цементы"],"key":[2,5],"multi":true,"ex":"Для постоянной фиксации — цементы: поликарбоксилатный, стеклоиономерный. «Водный дентин» и «Темп Бонд» — временные материалы, «Акрилоксид» — пломбировочная пластмасса."},{"id":"t2-17","topic":2,"n":17,"q":"Для проверки точности изготовления культевой штифтовой вкладки применяют:","opts":["воск","корригирующую силиконовую массу","окклюзионный спрей","артикуляционную бумагу"],"key":[2,3],"multi":true,"ex":"Точность прилегания проверяют корригирующей силиконовой массой (тонкий слой показывает места давления и щели) или окклюзионным спреем."},{"id":"t2-18","topic":2,"n":18,"q":"Требования к корням зубов, используемым для штифтовых конструкций:","opts":["канал запломбирован до верхушки","плотные ткани корня","канал не запломбирован до верхушки","толщина стенок корня не менее 1 мм","расширение периодонтальной щели"],"key":[1,2,4],"multi":true,"ex":"Требования: канал запломбирован до верхушки, ткани корня плотные, стенки не тоньше 1 мм. Расширение периодонтальной щели — признак патологии."},{"id":"t2-19","topic":2,"n":19,"q":"При протезировании больных искусственной культей со штифтом следует провести следующие параклинические методы обследования:","opts":["панорамную рентгенографию","изучение диагностических моделей","дентальную рентгенографию","реопародонтографию","гнатодинамометрию"],"key":[2,3],"multi":true,"ex":"Нужны дентальная (прицельная) рентгенография — оценить канал и периапикальные ткани — и диагностические модели. Реопародонтография и гнатодинамометрия — специальные методы, здесь не обязательные."},{"id":"t2-20","topic":2,"n":20,"q":"Преимущества протезирования искусственной культей со штифтом:","opts":["искусственную коронку, покрывающую культю, в случае необходимости можно снять или заменить","открывается возможность наложения мостовидного протеза при непараллельных каналах корней, используемых в качестве опоры","искусственную культю со штифтом можно изготовить из химического композита"],"key":[1,2],"multi":true,"ex":"Главные плюсы: коронку можно снять или заменить, не трогая культю; при непараллельных каналах культи можно сделать параллельными под мостовидный протез.","flag":{"kind":"note","suggest":null,"text":"Сегодня культю действительно часто делают из композита со стекловолоконным штифтом. Но в этом тесте вариант 3 не считается преимуществом литой культи."}},{"id":"t3-1","topic":3,"n":1,"q":"Если в зубной дуге несколько дефектов, относящихся к различным классам (по Кеннеди), то дугу относят к классу по порядку:","opts":["большему","меньшему"],"key":[2],"multi":false,"ex":"Правило для классификации Кеннеди: если в зубном ряду есть дефекты разных классов, ряд относят к меньшему по номеру классу, а остальные дефекты обозначают как подклассы."},{"id":"t3-2","topic":3,"n":2,"q":"К IV классу дефектов зубного ряда по Кеннеди относится:","opts":["односторонний концевой дефект","двусторонний концевой дефект","двусторонний включенный дефект в боковом отделе","включенный дефект в переднем отделе","односторонний включенный дефект в боковом отделе"],"key":[4],"multi":false,"ex":"IV класс Кеннеди — включённый дефект переднего отдела зубного ряда."},{"id":"t3-3","topic":3,"n":3,"q":"Процент населения земного шара, страдающего частичной потерей зубов:","opts":["50%","60%","75%","85%"],"key":[3],"multi":false,"ex":"Частичная потеря зубов — одно из самых распространённых заболеваний; в тестах приводится цифра 75 % населения."},{"id":"t3-4","topic":3,"n":4,"q":"К I классу дефектов зубного ряда по Кеннеди относится:","opts":["односторонний концевой дефект","двусторонний концевой дефект","двусторонний включенный дефект в боковом отделе","односторонний включенный дефект в боковом отделе"],"key":[2],"multi":false,"ex":"I класс Кеннеди — двусторонний концевой дефект."},{"id":"t3-5","topic":3,"n":5,"q":"Ко II классу дефектов зубного ряда по Кеннеди относится:","opts":["односторонний концевой дефект","двусторонний концевой дефект","включенный дефект в переднем отделе","односторонний дефект включенный в боковом отделе"],"key":[1],"multi":false,"ex":"II класс Кеннеди — односторонний концевой дефект."},{"id":"t3-6","topic":3,"n":6,"q":"К I классу дефектов зубного ряда по Жулеву относится дефект:","opts":["в боковом отделе","переднем отделе","комбинированный"],"key":[2],"multi":false,"ex":"Классификация Е.Н. Жулева (Нижний Новгород, 1997): I класс — дефекты переднего отдела, II — бокового (включённые и концевые), III — передне-боковые (комбинированные)."},{"id":"t3-7","topic":3,"n":7,"q":"При частичной потере зубов I место по частоте удаления занимают:","opts":["резцы","вторые премоляры","клыки","первые моляры","первые премоляры"],"key":[4],"multi":false,"ex":"Первые моляры прорезываются раньше всех (в 6 лет), рано поражаются кариесом и удаляются чаще других зубов."},{"id":"t3-8","topic":3,"n":8,"q":"Одонтопародонтограмма дает возможность судить:","opts":["о состоянии костной ткани пародонта","состоянии слизистой оболочки полости рта","степени подвижности зубов","определении резервных сил пародонта"],"key":[4],"multi":false,"ex":"Одонтопародонтограмма (по Курляндскому) отражает выносливость пародонта каждого зуба и позволяет оценить резервные силы для планирования протеза."},{"id":"t3-9","topic":3,"n":9,"q":"К III классу дефектов зубных рядов по Кеннеди относятся:","opts":["односторонний концевой дефект","двусторонний концевой дефект","двусторонний дефект включенный в боковых отделах","включенный дефект в переднем отделе","односторонний включенный дефект в боковом отделе"],"key":[5],"multi":false,"ex":"III класс Кеннеди — включённый (ограниченный с двух сторон) дефект в боковом отделе."},{"id":"t3-10","topic":3,"n":10,"q":"К I классу дефектов зубного ряда по Е.И. Гаврилову относятся:","opts":["включенные дефекты в боковом отделе","односторонний концевой дефект","двусторонний концевой дефект","включенный дефект в переднем отделе","одиночно стоящий зуб"],"key":[2],"multi":false,"ex":"По ключу I класс Гаврилова — односторонний концевой дефект.","flag":{"kind":"note","suggest":null,"text":"В учебнике Е.Н. Жулева классификация Гаврилова дана в развёрнутом виде: 1) односторонние концевые; 2) двусторонние концевые; 3) односторонние включённые боковые; 4) двусторонние включённые боковые; 5) включённые передние; 6) комбинированные; 7) челюсти с одиночно стоящими зубами. Ключ теста следует этой версии. В ряде других учебников та же классификация сведена в 4 группы (концевые / включённые / комбинированные / одиночно стоящие зубы) — там к I группе относятся все концевые дефекты."}},{"id":"t3-11","topic":3,"n":11,"q":"К III классу дефектов зубных рядов по Е.И. Гаврилову относятся:","opts":["односторонний концевой дефект","включенный дефект в переднем отделе","односторонний включенный дефект в боковом отделе","двусторонний концевой дефект"],"key":[3],"multi":false,"ex":"По ключу III класс Гаврилова — односторонний включённый дефект бокового отдела.","flag":{"kind":"note","suggest":null,"text":"Ключ следует развёрнутой классификации Гаврилова (учебник Жулева): 3) односторонние включённые дефекты боковых отделов. В сокращённой версии из 4 групп включённые дефекты — это II группа, а III — комбинированные."}},{"id":"t3-12","topic":3,"n":12,"q":"Ко II классу дефектов зубных рядов по Е.И. Гаврилову относятся:","opts":["включенный дефект в боковом отделе","односторонний концевой дефект","двусторонний концевой дефект","включенный дефект в переднем отделе","одиночно стоящий зуб"],"key":[3],"multi":false,"ex":"По ключу II класс Гаврилова — двусторонний концевой дефект.","flag":{"kind":"note","suggest":null,"text":"Ключ следует развёрнутой классификации Гаврилова (учебник Жулева): 2) двусторонние концевые. В сокращённой версии из 4 групп двусторонний концевой дефект относится к I группе."}},{"id":"t3-13","topic":3,"n":13,"q":"Частичную потерю зубов, осложненную деформацией, следует дифференцировать:","opts":["с аномалиями положения отдельных зубов","аномалиями прикуса","адентией зубов"],"key":[1,2],"multi":true,"ex":"Деформации при частичной потере зубов внешне похожи на зубочелюстные аномалии, поэтому их дифференцируют с аномалиями положения отдельных зубов и прикуса."},{"id":"t3-14","topic":3,"n":14,"q":"Е.И. Гаврилов в свою классификацию дефектов зубных рядов включил дефекты:","opts":["включенные","вколоченные","концевые","полные","комбинированные","одиночно стоящий зуб"],"key":[1,3,5,6],"multi":true,"ex":"Гаврилов выделяет концевые, включённые, комбинированные дефекты и челюсти с одиночно стоящими зубами."},{"id":"t3-15","topic":3,"n":15,"q":"Причины потери зубов:","opts":["кариес","пульпиты","периодонтиты","повышенная стираемость зубов","пародонтиты","травма","клиновидные дефекты"],"key":[1,2,3,5,6],"multi":true,"ex":"Основные причины удаления зубов: кариес и его осложнения (пульпит, периодонтит), заболевания пародонта, травма."},{"id":"t3-16","topic":3,"n":16,"q":"Виды перемещения зубов, приводящие к деформации окклюзионных поверхностей зубных рядов (по Е.И. Гаврилову):","opts":["вертикальное перемещение верхних и нижних зубов (одностороннее и двустороннее)","взаимное вертикальное перемещение верхних и нижних зубов","наклон зубов в оральном и вестибулярном направлениях","интрузия","поворот зуба вокруг вертикальной оси","транспозиция","дистальное или мезиальное перемещение","комбинированное перемещение"],"key":[1,2,3,5,7,8],"multi":true,"ex":"Формы перемещения зубов по Гаврилову: вертикальное (одно- и двустороннее), взаимное вертикальное, наклон, поворот вокруг оси, мезиальное или дистальное, комбинированное."},{"id":"t3-17","topic":3,"n":17,"q":"При частичной потере зубов зубные ряды в функциональном отношении распадаются на две основные группы зубов:","opts":["наклоненные или перемещенные в сторону дефекта","имеющие или не имеющие рядом стоящих зубов","находящиеся под нормальной нагрузкой или в условиях функциональной перегрузки","имеющие антагонистов (функционирующая группа)","утратившие антагонистов (нефункционирующая группа)"],"key":[4,5],"multi":true,"ex":"Функционирующая группа — зубы, имеющие антагонистов; нефункционирующая — утратившие их (в ней развивается вертикальное перемещение — феномен Попова–Годона)."},{"id":"t3-18","topic":3,"n":18,"q":"При функциональной перегрузке опорных зубов в стадии декомпенсации наблюдаются:","opts":["расширение периодонтальной щели","сужение периодонтальной щели","появление подвижности зуба","сохранение устойчивости зуба","появление патологических десневых и костных карманов"],"key":[1,3,5],"multi":true,"ex":"Декомпенсация: расширение периодонтальной щели, подвижность зуба, патологические десневые и костные карманы. Сохранение устойчивости — признак компенсации."},{"id":"t3-19","topic":3,"n":19,"q":"Резервные силы функционирующей группы зубов при частичной потере зубов зависят:","opts":["от общего состояния организма","изменений в пародонте, возникших в результате перегрузки","соотношения клинических коронок к корням зубов","эстетических норм"],"key":[1,2,3],"multi":true,"ex":"Резервные силы зависят от общего состояния организма, состояния пародонта и соотношения клинической коронки и корня (чем длиннее «рычаг» коронки, тем хуже)."},{"id":"t3-20","topic":3,"n":20,"q":"Дефекты зубных рядов могут возникать вследствие:","opts":["кариеса и его осложнений","заболевания пародонта","травмы","ятрогенных ошибок","вредных привычек","заболеваний ВНЧС","наличия ретинированных зубов"],"key":[1,2,3,4],"multi":true,"ex":"Дефекты зубных рядов возникают после удаления зубов из-за кариеса и его осложнений, болезней пародонта, травмы и ятрогенных ошибок."},{"id":"t4-1","topic":4,"n":1,"q":"Укажите виды прикуса, при котором сужаются показания к протезированию мостовидными протезами:","opts":["открытый","глубокий","перекрестный","прямой"],"key":[1],"multi":false,"ex":"По ключу — открытый прикус. Логика: при открытом прикусе часть зубов лишена антагонистов, и жевательная нагрузка ложится на меньшее число контактирующих зубов, опоры моста легко перегружаются.","flag":{"kind":"note","suggest":null,"text":"Обоснование по ключу в источниках описано скупо. Если преподаватель спросит «почему», опирайтесь на перегрузку опорных зубов из-за неполноценных окклюзионных контактов."}},{"id":"t4-2","topic":4,"n":2,"q":"Можно ли при планировании мостовидного протеза малой протяженности зуб с подвижностью первой степени использовать в качестве опоры?","opts":["да, если включить в состав протеза рядом стоящий неподвижный зуб","нет, этот зуб подлежит удалению","да, если зуб депульпировать"],"key":[1],"multi":false,"ex":"Зуб с подвижностью I степени можно использовать как опору, если объединить его с соседним устойчивым зубом: шинирование повышает выносливость опоры."},{"id":"t4-3","topic":4,"n":3,"q":"Проверка опорных коронок является клиническим этапом при изготовлении мостовидного протеза:","opts":["паяного","любого","цельнолитого","металлокерамического","металлопластмассового"],"key":[1],"multi":false,"ex":"Отдельная клиническая проверка опорных коронок — этап паяного (штампованно-паяного) протеза. Литые конструкции проверяют уже как единый каркас."},{"id":"t4-4","topic":4,"n":4,"q":"Промежуточная часть (тело) мостовидного протеза в переднем отделе зубного ряда верхней челюсти по отношению к слизистой оболочке располагается:","opts":["касательно","с седловидной формой","промывным пространством (висячая форма)","произвольно","зависит от протяженности дефекта зубного ряда"],"key":[1],"multi":false,"ex":"В переднем отделе тело моста касается десны (касательная форма) — ради эстетики и чёткой речи."},{"id":"t4-5","topic":4,"n":5,"q":"К недостаткам мостовидных протезов можно отнести:","opts":["возможность протезирования при сравнительно небольших дефектах зубных рядов","возможность использования в качестве иммедиат-протеза","обязательное препарирование опорных зубов","минимальный срок привыкания"],"key":[3],"multi":false,"ex":"Главный недостаток — обязательное препарирование (часто интактных) опорных зубов. Остальные варианты — достоинства."},{"id":"t4-6","topic":4,"n":6,"q":"При наклоне опорных зубов в сторону дефекта показан:","opts":["разборный мостовидный протез, одна из опор которого сочленяется с наклонившимся зубом вкладкой во вкладке, опорно-удерживающим кламмером, замковым креплением","паяный мостовидный протез с опорой на штампованных коронках","мостовидный протез с телескопической системой крепления"],"key":[1],"multi":false,"ex":"При наклоне опоры общего пути введения нет, поэтому делают разборный протез: соединение «вкладка во вкладке», опорно-удерживающий кламмер или замок."},{"id":"t4-7","topic":4,"n":7,"q":"Все боковые стенки опорных зубов при изготовлении мостовидного протеза препарируются:","opts":["с наклоном в сторону дефекта","параллельно","с наклоном в сторону от дефекта"],"key":[2],"multi":false,"ex":"Стенки опорных зубов препарируют параллельно друг другу (с небольшой конусностью), чтобы протез имел общий путь введения."},{"id":"t4-8","topic":4,"n":8,"q":"Моделирование тела металлокерамического мостовидного протеза производится:","opts":["перед моделированием опорных коронок","на этапе припасовки опорных коронок на модели","одновременно с моделированием опорных коронок","после этапа припасовки опорных коронок в клинике"],"key":[3],"multi":false,"ex":"Каркас металлокерамического моста отливается целиком, поэтому тело моделируют одновременно с опорными коронками."},{"id":"t4-9","topic":4,"n":9,"q":"Моделирование промежуточной части паяного мостовидного протеза производится:","opts":["перед моделированием опорных коронок","на этапе припасовки опорных коронок на модели","одновременно с моделированием опорных коронок","после этапа припасовки опорных коронок в клинике"],"key":[4],"multi":false,"ex":"У паяного моста сначала изготавливают и припасовывают в клинике опорные коронки, затем моделируют и отливают тело и спаивают его с коронками."},{"id":"t4-10","topic":4,"n":10,"q":"Основными элементами конструкции мостовидных протезов являются:","opts":["опорные части","промежуточная часть","дуги","кламмеры"],"key":[1,2],"multi":true,"ex":"Мост состоит из опорных частей и промежуточной части (тела). Дуги и кламмеры — элементы съёмных протезов."},{"id":"t4-11","topic":4,"n":11,"q":"Противопоказаниями к применению полукоронок в качестве опорных элементов мостовидного протеза являются:","opts":["включенный дефект зубного ряда, образовавшийся при отсутствии резцов","разрушение кариесом контактных поверхностей опорных зубов","интактные опорные зубы, имеющие высокие клинические коронки","отсутствие параллельности опорных зубов"],"key":[2,4],"multi":true,"ex":"Полукоронка не покрывает контактные поверхности, поэтому кариес на них и непараллельность опор — противопоказания."},{"id":"t4-12","topic":4,"n":12,"q":"Конструкция мостовидного протеза зависит:","opts":["от состояния пародонта опорных зубов","протяженности дефекта зубного ряда","топографии дефекта зубного ряда","технологии мостовидного протеза","материала мостовидного протеза"],"key":[1,2,3],"multi":true,"ex":"Конструкцию определяют клинические факторы: состояние пародонта опор, протяжённость и топография дефекта."},{"id":"t4-13","topic":4,"n":13,"q":"При повторном протезировании после снятия мостовидного протеза необходимо:","opts":["оценить степень подвижности опорных зубов","исследовать глубину зубодесневой бороздки","провести ЭОД опорных зубов","провести рентгенографию ранее леченых опорных зубов"],"key":[1,4],"multi":true,"ex":"Перед повторным протезированием оценивают подвижность опор и рентгенологически — состояние ранее леченых зубов."},{"id":"t4-14","topic":4,"n":14,"q":"Показания к протезированию мостовидным протезом больного с частичной потерей зубов зависят:","opts":["от желания больного","вида дефекта","величины дефекта","топографии дефекта","состояния пародонта зубов, пограничных с дефектом зубного ряда"],"key":[2,3,4,5],"multi":true,"ex":"Показания определяются клиническими данными: вид, величина и топография дефекта, пародонт зубов, ограничивающих дефект. Одного желания пациента недостаточно."},{"id":"t4-15","topic":4,"n":15,"q":"Малые седловидные протезы имеют в качестве опорных элементов:","opts":["коронки","полукоронки","штифтовые зубы","кламмеры","телескопические коронки"],"key":[4,5],"multi":true,"ex":"Малые седловидные протезы — съёмные, их фиксируют кламмерами или телескопическими коронками."},{"id":"t4-16","topic":4,"n":16,"q":"При увеличении длины промежуточной части мостовидного протеза врач должен:","opts":["указать технику на необходимость усиленной пайки","уменьшить ширину окклюзионной поверхности промежуточной части протеза","использовать в качестве опоры большее количество зубов"],"key":[2,3],"multi":true,"ex":"Чем длиннее тело, тем выше нагрузка на опоры. Поэтому сужают окклюзионную поверхность тела и увеличивают число опорных зубов. Пайка тут ни при чём."},{"id":"t4-17","topic":4,"n":17,"q":"Положительными качествами мостовидных протезов являются:","opts":["высокая гигиеничность","высокая жевательная эффективность","небольшие размеры","быстрая адаптация к ним"],"key":[2,3,4],"multi":true,"ex":"Мосты компактны, к ним быстро привыкают, они хорошо восстанавливают жевание. Высокой гигиеничностью они не отличаются: под телом скапливается налёт."},{"id":"t4-18","topic":4,"n":18,"q":"У мостовидного протеза по сравнению с дуговым протезом:","opts":["выше нагрузка на пародонт опорных зубов","быстрее адаптация к протезу","длительнее адаптация к протезу","ниже нагрузка на пародонт опорных зубов"],"key":[1,2],"multi":true,"ex":"Мост опирается только на зубы, поэтому нагрузка на их пародонт выше, чем у дугового протеза (тот частично передаёт её на слизистую). Зато привыкание к мосту быстрее."},{"id":"t4-19","topic":4,"n":19,"q":"При протезировании мостовидным протезом с односторонней опорой, нагрузка на опорный зуб падает:","opts":["в вертикальной плоскости","горизонтальной плоскости","трансверзальной плоскости"],"key":[1,2],"multi":true,"ex":"Консольный мост работает как рычаг: на опорный зуб действуют вертикальная и опрокидывающая горизонтальная нагрузки."},{"id":"t4-20","topic":4,"n":20,"q":"В качестве опорных элементов в мостовидных протезах используют:","opts":["коронки","полукоронки","штифтовые зубы","вкладки","дентальные пелоты"],"key":[1,2,3,4],"multi":true,"ex":"Опорные элементы моста: коронки, полукоронки, штифтовые зубы, вкладки. Пелоты относятся к съёмным и ортодонтическим аппаратам."},{"id":"t5-1","topic":5,"n":1,"q":"При протезировании мостовидными протезами слепки снимают на этапе припасовки:","opts":["каркасов цельнолитых цельнометаллических мостовидных протезов","каркасов цельнолитых комбинированных мостовидных протезов","опорных элементов паяных мостовидных протезов"],"key":[3],"multi":false,"ex":"После припасовки штампованных опорных коронок снимают оттиск вместе с ними — по нему моделируют тело и спаивают протез."},{"id":"t5-2","topic":5,"n":2,"q":"Моделировать жевательную поверхность опорных зубов одновременно с промежуточной частью штампованно-паяного мостовидного протеза предлагал:","opts":["Вебер","Пономарев","Копейкин","Боянов","Погодин"],"key":[3],"multi":false,"ex":"Моделировать жевательные поверхности опорных коронок одновременно с телом предложил В.Н. Копейкин."},{"id":"t5-3","topic":5,"n":3,"q":"Для пайки коронок из нержавеющей стали применяют припой на основе:","opts":["золота","буры","олова","серебра"],"key":[4],"multi":false,"ex":"Детали из нержавеющей стали паяют серебряным припоем (припой Цитрина)."},{"id":"t5-4","topic":5,"n":4,"q":"Флюсы при паянии применяют:","opts":["для очищения спаиваемых поверхностей","уменьшения температуры плавления припоя","увеличения площади спаиваемых поверхностей","предотвращения образования оксидной пленки","предварительного соединения спаиваемых деталей"],"key":[4],"multi":false,"ex":"Флюс (например, бура) предотвращает образование оксидной плёнки, благодаря чему припой смачивает и соединяет металл."},{"id":"t5-5","topic":5,"n":5,"q":"На этапе припасовки паяного мостовидного протеза врач должен получить протез из зуботехнической лаборатории:","opts":["на рабочей модели","без модели","на гипсовых моделях штампов"],"key":[1],"multi":false,"ex":"Протез принимают из лаборатории на рабочей модели — так его можно проверить и при необходимости исправить."},{"id":"t5-6","topic":5,"n":6,"q":"Специальный припой для стали с температурой плавления 800°С был предложен:","opts":["В.Н. Копейкиным","А.Г. Цитриным","В.А. Пономаревым","О.Д. Глазовым"],"key":[2],"multi":false,"ex":"Серебряный припой для стали с температурой плавления около 800 °C предложил А.Г. Цитрин."},{"id":"t5-7","topic":5,"n":7,"q":"Установить степень наклона опорных зубов и в зависимости от выбранного пути введения протеза наметить, какое количество твердых тканей необходимо сошлифовать для свободного наложения протеза, позволяет:","opts":["гнатодинамометр","аппарат Петросова","аппарат Пономарева","параллелометр"],"key":[4],"multi":false,"ex":"Параллелометр определяет наклон зубов и общий путь введения протеза."},{"id":"t5-8","topic":5,"n":8,"q":"Какую форму должна иметь промежуточная часть паяного мостовидного протеза в боковом отделе зубного ряда нижней челюсти?","opts":["седловидную","висячую","полуседловидную"],"key":[2],"multi":false,"ex":"В боковом отделе нижней челюсти тело делают висячим (промывным): под ним свободно проходят пища и слюна."},{"id":"t5-9","topic":5,"n":9,"q":"Перед планированием ортопедического лечения целесообразно:","opts":["препарировать опорные зубы","изготовить диагностические модели","сделать анестезию","провести функциональные пробы"],"key":[3],"multi":false,"ex":"Засчитывается ответ по ключу кафедры. Почему он спорен и какой вариант, вероятно, верен — в замечании ниже.","flag":{"kind":"dispute","suggest":[2],"text":"Перед составлением плана лечения изготавливают диагностические модели (вариант 2). Анестезия — уже этап препарирования, то есть самого лечения. Похоже на ошибку в ключе или в выделении маркером — стоит уточнить у преподавателя."}},{"id":"t5-10","topic":5,"n":10,"q":"В среднем величина промывного пространства промежуточной части мостовидного протеза колеблется в пределах:","opts":["0,3–0,5 мм","0,5–0,8 мм","0,8–1 мм","1–1,5 мм","1,5–2 мм","2–2,5 мм"],"key":[4],"multi":false,"ex":"По ключу — 1–1,5 мм.","flag":{"kind":"note","suggest":null,"text":"В разных пособиях величина промывного пространства указана по-разному (встречается и 2–3 мм). Запомните значение из ключа кафедры."}},{"id":"t5-11","topic":5,"n":11,"q":"Перед фиксацией мостовидного протеза необходимо обработать опорные зубы:","opts":["спиртом","спиртом, эфиром","перекисью водорода, спиртом","перекисью водорода, спиртом, высушить теплым воздухом","перекисью водорода, спиртом, эфиром"],"key":[4],"multi":false,"ex":"Опорные зубы очищают перекисью водорода, обезжиривают спиртом и высушивают тёплым воздухом — для надёжного сцепления цемента."},{"id":"t5-12","topic":5,"n":12,"q":"К возможным недостаткам паяных мостовидных протезов из нержавеющей стали относятся:","opts":["окисление припоя, почернение места пайки","возникновение гальванических токов","привкус металла в полости рта","быстрое стирание зубов-антагонистов","перелом в месте спайки частей протеза"],"key":[1,2,3,5],"multi":true,"ex":"Недостатки паяных стальных мостов: окисление припоя и почернение места пайки, гальванические токи, металлический привкус, перелом по месту спайки."},{"id":"t5-13","topic":5,"n":13,"q":"Клинически мостовидные протезы перед фиксацией оцениваются по следующим показателям:","opts":["легкость наложения на культи опорных зубов","точность воспроизведения окклюзионных поверхностей искусственных зубов","отсутствие преждевременных контактов","погружение края фиксирующих коронок на 0,2–0,3 мм в десневую бороздку по всему периметру шейки зуба","только точность воспроизведения анатомической формы и цвета искусственных зубов"],"key":[1,2,3,4],"multi":true,"ex":"Перед фиксацией проверяют: лёгкость наложения, окклюзионную поверхность, отсутствие преждевременных контактов, погружение края коронок в бороздку на 0,2–0,3 мм."},{"id":"t5-14","topic":5,"n":14,"q":"Клиническими этапами протезирования паяными мостовидными протезами являются:","opts":["обследование больного, анестезия, препарирование зубов, получение оттисков","припасовка коронок, получение оттисков","припасовка мостовидного протеза","шлифовка и полировка протеза","фиксация мостовидного протеза постоянным цементом"],"key":[1,2,3,5],"multi":true,"ex":"Клинические этапы: обследование, препарирование, оттиски → припасовка коронок, оттиск → припасовка моста → фиксация. Шлифовка и полировка — лабораторный этап."},{"id":"t5-15","topic":5,"n":15,"q":"Преимуществами цельнолитых мостовидных протезов перед паяными являются:","opts":["более высокая жевательная эффективность","отсутствие припоя","более точное воспроизведение анатомической формы зубов литыми коронками","простота изготовления","более высокая прочность","меньшая возможность сенсибилизации организма больного"],"key":[1,2,3,5,6],"multi":true,"ex":"Цельнолитой мост точнее, прочнее и не содержит припоя (меньше гальванизма и сенсибилизации). А вот изготовить его сложнее, а не проще."},{"id":"t5-16","topic":5,"n":16,"q":"При оценке качества оттисков для изготовления мостовидных протезов важны:","opts":["четкий рельеф десневой бороздки по периметру каждого опорного зуба","четкость отображения поверхности альвеолярных частей в области отсутствующих зубов","точность отображения переходной складки","наличие нечетких, размытых отпечатков протезного ложа","отсутствие пор на поверхности протезного ложа"],"key":[1,2,5],"multi":true,"ex":"Важны чёткий отпечаток десневой бороздки вокруг опор и альвеолярного гребня в области дефекта, а также отсутствие пор. Переходная складка важна для съёмных протезов."},{"id":"t5-17","topic":5,"n":17,"q":"У паяных золотых мостовидных протезов по сравнению со стальными:","opts":["выше гальванизм","выше твердость","ниже гальванизм","ниже твердость"],"key":[3,4],"multi":true,"ex":"У золотых мостов ниже гальванизм (благородный металл) и ниже твёрдость (меньше стираются антагонисты)."},{"id":"t5-18","topic":5,"n":18,"q":"Выбор количества опорных зубов при планировании конструкции мостовидного протеза зависит:","opts":["от состояния пародонта зубов-антагонистов","топографии дефекта зубного ряда","протяженности дефекта зубного ряда","состояния пародонта зубов, ограничивающих дефект","материала и метода изготовления протеза"],"key":[1,2,3,4],"multi":true,"ex":"Число опор зависит от пародонта опорных зубов и антагонистов, топографии и протяжённости дефекта."},{"id":"t5-19","topic":5,"n":19,"q":"Показания к изготовлению консольного мостовидного протеза:","opts":["подвижность опорных зубов","дистально неограниченный (концевой) дефект","отсутствие второго премоляра","прогенический прикус","отсутствие бокового резца верхней челюсти"],"key":[3,5],"multi":true,"ex":"По ключу — отсутствие второго премоляра и бокового резца верхней челюсти.","flag":{"kind":"note","suggest":null,"text":"Консольный мост — протез с односторонней опорой. Подвижность опор — противопоказание. Концевые дефекты консольными мостами, как правило, не замещают (некоторые руководства допускают консоль на один премоляр при нескольких опорах)."}},{"id":"t5-20","topic":5,"n":20,"q":"При выборе конструкции мостовидного протеза учитывают:","opts":["топографию дефекта зубного ряда","состояние пародонта зубов-антагонистов","величину дефекта зубного ряда","абсолютную силу жевательных мышц","анатомическую форму зубов","состояние пародонта опорных зубов"],"key":[1,2,3,6],"multi":true,"ex":"Учитывают топографию и величину дефекта, состояние пародонта опорных зубов и антагонистов."},{"id":"t6-1","topic":6,"n":1,"q":"Для достижения сцепления керамической облицовки с металлическим каркасом необходимо подвергнуть каркас:","opts":["пескоструйной обработке","пескоструйной обработке и обезжирить","пескоструйной обработке, обезжирить и создать окисную пленку"],"key":[3],"multi":false,"ex":"Каркас обрабатывают пескоструйно, обезжиривают и окисляют: оксидная плёнка обеспечивает химическую связь металла с керамикой."},{"id":"t6-2","topic":6,"n":2,"q":"При подготовке зуба под металлокерамическую коронку наибольшие кровоизлияния в пульпе могут наблюдаться:","opts":["во всех ее слоях одинаково","там, где снят наиболее толстый слой твердых тканей зуба","в пришеечной части зуба"],"key":[2],"multi":false,"ex":"Сильнее всего страдает пульпа там, где снят самый толстый слой тканей: меньше остаётся дентина и сильнее нагрев."},{"id":"t6-3","topic":6,"n":3,"q":"Особенностью комбинированных мостовидных протезов является:","opts":["наличие опорных коронок","наличие пластмассовой или керамической облицовки","наличие промывного пространства","отсутствие жевательных бугров"],"key":[2],"multi":false,"ex":"Комбинированный протез — металлический каркас с облицовкой из пластмассы или керамики."},{"id":"t6-4","topic":6,"n":4,"q":"Первый слой керамической массы, наносимый на металлический каркас металлокерамической коронки, называется:","opts":["дентинным слоем","эмалевым слоем","глазурью","грунтовым (опаковым) слоем"],"key":[2],"multi":false,"ex":"Засчитывается ответ по ключу кафедры. Почему он спорен и какой вариант, вероятно, верен — в замечании ниже.","flag":{"kind":"dispute","suggest":[4],"text":"Первым на металлический каркас наносят грунтовый (опаковый) слой: он маскирует металл и обеспечивает связь с оксидной плёнкой. Затем идут дентинный и эмалевый слои, глазурь. Эмалевый слой — один из последних."}},{"id":"t6-5","topic":6,"n":5,"q":"При здоровом пародонте, когда десневой карман выражен слабо, уступ следует располагать ниже десневого края:","opts":["на 0,1–0,2 мм","0,2–0,3 мм","0,3–0,4 мм","0,4–0,5 мм"],"key":[2],"multi":false,"ex":"При здоровом пародонте и неглубокой бороздке уступ погружают под десну на 0,2–0,3 мм: край скрыт, а зубодесневое прикрепление не травмируется."},{"id":"t6-6","topic":6,"n":6,"q":"У металлокерамических протезов по сравнению с цельнолитыми металлопластмассовыми:","opts":["выше стираемость и цветостойкость","выше стираемость, но ниже цветостойкость","ниже стираемость и цветостойкость","ниже стираемость, но выше цветостойкость"],"key":[4],"multi":false,"ex":"Керамика стирается меньше пластмассы и не меняет цвет; пластмасса со временем стирается и темнеет."},{"id":"t6-7","topic":6,"n":7,"q":"Основой металлокерамической коронки является колпачок:","opts":["штампованный","паяный","литой","из платиновой фольги"],"key":[3],"multi":false,"ex":"Основа металлокерамической коронки — литой колпачок (каркас)."},{"id":"t6-8","topic":6,"n":8,"q":"Толщина металлического колпачка из КХС металлокерамической коронки равна:","opts":["0,1 мм","0,3 мм","0,2 мм","0,5 мм","0,7 мм"],"key":[2],"multi":false,"ex":"Литой колпачок из КХС имеет толщину около 0,3 мм."},{"id":"t6-9","topic":6,"n":9,"q":"При изготовлении мостовидного протеза в лаборатории опорные зубы предварительно перед отливкой из металла моделируются:","opts":["гипсом","пластмассой","цементом","воском"],"key":[4],"multi":false,"ex":"Каркас моделируют из воска и отливают из металла методом выплавляемых моделей."},{"id":"t6-10","topic":6,"n":10,"q":"Слой керамического покрытия, который придает металлокерамической коронке основной цветовой тон, называют:","opts":["дентинным слоем","эмалевым слоем","глазурью","грунтовым (опаковым) слоем"],"key":[1],"multi":false,"ex":"Основной цвет коронке придаёт дентинный слой. Эмалевый даёт прозрачность режущего края, опаковый скрывает металл."},{"id":"t6-11","topic":6,"n":11,"q":"При изготовлении металлопластмассовой коронки сошлифовывание значительного количества твердых тканей в пришеечной области и формирование уступа обусловлены необходимостью:","opts":["улучшения фиксации коронки","создания плотного контакта коронки с тканями зуба","уменьшения травмы десны и улучшения эстетики","для лучшей фиксации временной коронки"],"key":[3],"multi":false,"ex":"Уступ даёт место для металла и облицовки без утолщения края: коронка не травмирует десну, и металл не просвечивает у шейки."},{"id":"t6-12","topic":6,"n":12,"q":"При заболеваниях или возрастных изменениях пародонта, когда имеется выраженный десневой карман, уступ необходимо погружать в него:","opts":["на 0,1–0,2 мм","0,2–0,3 мм","0,5–1 мм","1–1,5 мм"],"key":[3],"multi":false,"ex":"При выраженном десневом кармане уступ погружают глубже — на 0,5–1 мм."},{"id":"t6-13","topic":6,"n":13,"q":"Для облицовки металлопластмассового мостовидного протеза используется:","opts":["«Синма М»","«Акрилоксид»","«Этакрил»","«Протакрил»","«Карбодент»"],"key":[1],"multi":false,"ex":"«Синма-М» — пластмасса для облицовки металлопластмассовых протезов. Остальные — базисные, ремонтные и пломбировочные материалы."},{"id":"t6-14","topic":6,"n":14,"q":"При препарировании опорных зубов мостовидного металлокерамического протеза апроксимальные стенки должны:","opts":["быть строго параллельны","слегка дивергировать","конвергировать под углом 6–8°","конвергировать под углом 15–20°","конвергировать под углом 9°"],"key":[3],"multi":false,"ex":"Апроксимальные стенки сводят под углом 6–8°: так сохраняется ретенция, а протез свободно накладывается."},{"id":"t6-15","topic":6,"n":15,"q":"При изготовлении металлокерамического мостовидного протеза фарфоровая масса до обжига наносится на каркас в объеме по отношению к объему естественного зуба:","opts":["несколько меньше","полном","несколько большем"],"key":[3],"multi":false,"ex":"Керамическая масса при обжиге даёт заметную усадку, поэтому её наносят с избытком."},{"id":"t6-16","topic":6,"n":16,"q":"У металлокерамических мостовидных протезов в сравнении с цельнолитыми металлопластмассовыми:","opts":["выше прочность","выше гигроскопичность","ниже прочность","ниже гигроскопичность"],"key":[1,4],"multi":true,"ex":"Металлокерамика прочнее и практически не впитывает влагу, в отличие от пластмассы (она впитывает влагу, красители и запахи)."},{"id":"t6-17","topic":6,"n":17,"q":"Точность прилегания металлического каркаса мостовидного протеза к опорным зубам можно проверить с помощью:","opts":["окклюзионного спрея","окклюзионной бумаги","воска","корригирующей силиконовой массы"],"key":[1,4],"multi":true,"ex":"Прилегание каркаса проверяют окклюзионным спреем или корригирующей силиконовой массой: они показывают места давления."},{"id":"t6-18","topic":6,"n":18,"q":"При препарировании опорных зубов под комбинированный металлопластмассовый мостовидный протез уступ формируют:","opts":["со всех сторон","вестибулярной стороны","на толщину 1 мм","с вестибулярной и апроксимальных сторон","медиальной и дистальной сторон","необходимости препарирования зубов с уступом нет"],"key":[1,3],"multi":true,"ex":"Под комбинированный протез уступ формируют циркулярно, шириной около 1 мм — это место для металла и облицовки."},{"id":"t6-19","topic":6,"n":19,"q":"Клинически мостовидные протезы перед фиксацией оцениваются по следующим показателям:","opts":["легкость наложения на культи опорных зубов","правильность моделирования тела протеза в переднем и боковых отделах зубного ряда (касательная или промывная формы)","удобство для пациента","незначительность перекрытия слизистой оболочки искусственными зубами при касательной форме тела протеза","точность воспроизведения анатомической формы и цвета искусственных зубов"],"key":[1,2,4,5],"multi":true,"ex":"Перед фиксацией оценивают посадку, форму тела (касательная или промывная), минимальное перекрытие слизистой, форму и цвет зубов. «Удобство для пациента» — субъективный критерий."},{"id":"t6-20","topic":6,"n":20,"q":"При протезировании металлокерамическими и металлопластмассовыми мостовидными протезами оттиск снимают:","opts":["термомассами","альгинатными материалами","гипсом","силиконовыми материалами","полисульфидными (тиоколовыми) материалами","цинкоксидэвгеноловыми материалами"],"key":[1,5],"multi":true,"ex":"Засчитывается ответ по ключу кафедры. Почему он спорен и какой вариант, вероятно, верен — в замечании ниже.","flag":{"kind":"dispute","suggest":[4,5],"text":"Для металлокерамики и металлопластмассы нужен точный двухслойный оттиск эластомерами — силиконовыми (вариант 4) или полисульфидными. Термомассы недостаточно точны и для этих конструкций не применяются. Пометка на полях («силиконовые подходят больше») — верная."}},{"id":"t7-1","topic":7,"n":1,"q":"При препарировании зуба под керамическую коронку уступ следует делать на поверхности (-ях):","opts":["вестибулярной","вестибулярной и контактных","вестибулярной, оральной и контактных","вестибулярной, оральной, окклюзионной и контактных"],"key":[3],"multi":false,"ex":"Под керамическую коронку уступ делают по кругу — на вестибулярной, оральной и контактных поверхностях. Окклюзионную поверхность просто укорачивают."},{"id":"t7-2","topic":7,"n":2,"q":"У стоматологической керамики, применяемой при изготовлении металлокерамического мостовидного протеза, происходит процесс:","opts":["сухого спекания","полужидкого спекания","жидкого спекания"],"key":[3],"multi":false,"ex":"Керамика спекается с образованием жидкой (стекловидной) фазы — это «жидкое спекание»."},{"id":"t7-3","topic":7,"n":3,"q":"При препарировании опорных зубов керамического мостовидного протеза создают:","opts":["круговой уступ под углом 135°","уступ под углом 135° только с вестибулярной стороны","уступ под углом 90° только с вестибулярной стороны","круговой уступ под углом 90°","сошлифовывание большого количества тканей опорных зубов не требуется, уступ не нужен"],"key":[4],"multi":false,"ex":"Для керамики нужен круговой уступ под углом 90°: материалу нужны опора и достаточная толщина."},{"id":"t7-4","topic":7,"n":4,"q":"Форма тела керамического мостовидного протеза в области передних зубов по отношению к десне:","opts":["касательная","промывная","седловидная","может быть любой","зависит от протяженности дефекта"],"key":[1],"multi":false,"ex":"В переднем отделе тело касается десны (касательная форма) — для эстетики."},{"id":"t7-5","topic":7,"n":5,"q":"Фиксировать керамический мостовидный протез временным цементом можно:","opts":["на любой срок наблюдения за больным","если у больного нет бруксизма","не более чем на 5–7 месяцев","нельзя"],"key":[1],"multi":false,"ex":"По ключу — на любой срок наблюдения за больным.","flag":{"kind":"note","suggest":null,"text":"Практическое уточнение: металлокерамику и мосты на каркасе из диоксида циркония можно временно фиксировать на период наблюдения. Стеклокерамику (например, дисиликат лития) временно фиксировать нежелательно: её фиксируют адгезивно, иначе возможен скол."}},{"id":"t7-6","topic":7,"n":6,"q":"Форма тела керамического мостовидного протеза в области боковых зубов по отношению к десне:","opts":["касательная","промывная","седловидная","может быть любой","зависит от протяженности дефекта"],"key":[2],"multi":false,"ex":"В боковом отделе тело делают промывным — для гигиены."},{"id":"t7-7","topic":7,"n":7,"q":"При препарировании зуба под керамическую коронку апроксимальные стенки должны:","opts":["быть строго параллельны","слегка дивергировать","конвергировать под углом 6–8°","конвергировать под углом 15–20°","конвергировать под углом 20–30°"],"key":[3],"multi":false,"ex":"Апроксимальные стенки сводят под углом 6–8°, как и под металлокерамику."},{"id":"t7-8","topic":7,"n":8,"q":"Промежуточная часть керамического мостовидного протеза в области боковых зубов по отношению к десне:","opts":["касается по всей поверхности","касается в двух точках","касается в одной точке","не касается"],"key":[4],"multi":false,"ex":"При промывной форме тело не касается слизистой."},{"id":"t7-9","topic":7,"n":9,"q":"В качестве матрицы для изготовления фарфорового колпачка применяется платина, поскольку она:","opts":["это благородный металл","имеет минимально возможную толщину","достаточно жестка и не образует окислов","по химическим свойствам совместима с фарфором","имеет высокую температуру плавления"],"key":[5],"multi":false,"ex":"Платиновая фольга не плавится при обжиге фарфора (температура плавления около 1770 °C), поэтому служит матрицей. Вариант 4 («совместима с фарфором»), предложенный ИИ, — неточный: главное здесь тугоплавкость."},{"id":"t7-10","topic":7,"n":10,"q":"При обжиге фарфоровой массы, кроме воздействия высокой температуры, используют:","opts":["давление","вакуум","центрифугирование","верно все перечисленное"],"key":[2],"multi":false,"ex":"Фарфор обжигают в вакуумной печи: вакуум удаляет воздух из массы, уменьшает пористость, повышает прочность и прозрачность."},{"id":"t7-11","topic":7,"n":11,"q":"Протезирование керамическим мостовидным протезом предпочтительнее, так как выглядит более эстетично:","opts":["при протезировании в переднем отделе и высоком уровне прозрачности эмали","протезировании в области задних жевательных зубов","протезировании жевательных зубов, под опору для кламмеров"],"key":[1],"multi":false,"ex":"Керамика лучше других материалов передаёт прозрачность эмали — это её преимущество во фронтальном отделе."},{"id":"t7-12","topic":7,"n":12,"q":"При изготовлении керамического мостовидного протеза на каркасе из диоксида циркония фарфоровая масса до обжига наносится в объеме по отношению к объему естественного зуба:","opts":["несколько меньшем","полном","несколько большем"],"key":[3],"multi":false,"ex":"Облицовочную керамику на каркас из диоксида циркония тоже наносят с избытком — из-за усадки при обжиге."},{"id":"t7-13","topic":7,"n":13,"q":"Моделирование тела керамического мостовидного протеза производится:","opts":["перед моделированием опорных коронок","на этапе припасовки опорных коронок на модели","одновременно с моделированием опорных коронок","после этапа припасовки опорных коронок в клинике"],"key":[3],"multi":false,"ex":"Каркас моста моделируют целиком: тело — одновременно с опорными коронками."},{"id":"t7-14","topic":7,"n":14,"q":"Проверка контактов на этапе припасовки несъемного мостовидного протеза проводится при окклюзиях:","opts":["сагиттальных","центральной и сагиттальных","сагиттальной и боковых","центральной и боковых"],"key":[4],"multi":false,"ex":"Контакты проверяют в центральной и боковых окклюзиях, устраняя преждевременные контакты."},{"id":"t7-15","topic":7,"n":15,"q":"Для припасовки керамического мостовидного протеза точность прилегания коронок к зубам оценивается с помощью:","opts":["базисного воска","гипса","эластического слепочного материала","копировальной бумаги"],"key":[3],"multi":false,"ex":"Прилегание коронок проверяют эластичным (силиконовым) материалом: тонкая плёнка показывает щели и места давления."},{"id":"t7-16","topic":7,"n":16,"q":"Для временной фиксации мостовидных протезов применяются:","opts":["«Акрилоксид»","«Водный дентин»","«Висфат цемент»","«Силидонт»","«ТемпоФот» (фирма «Владмива»)","«Temp Bond»"],"key":[2,5,6],"multi":true,"ex":"Временные материалы — «Водный дентин», «ТемпоФот», Temp Bond. «Висфат» — постоянный цинк-фосфатный цемент, «Акрилоксид» и «Силидонт» — пломбировочные материалы."},{"id":"t7-17","topic":7,"n":17,"q":"Для постоянной фиксации керамических мостовидных протезов применяют:","opts":["«Репин»","«RelyX U100» («3М ESPE», США)","«Temp Bond»","«Водный дентин»","«Силидонт»","стеклоиономерные цементы","«MaxCem Elite™» («Kerr»)"],"key":[2,6,7],"multi":true,"ex":"Для постоянной фиксации керамики — стеклоиономерные и самоадгезивные композитные цементы (RelyX U100, MaxCem Elite)."},{"id":"t7-18","topic":7,"n":18,"q":"При протезировании частичной потери зубов керамическими мостовидными протезами артикулятор выполняет функции:","opts":["диагностическую","лечебную","основную"],"key":[1,3],"multi":true,"ex":"Артикулятор выполняет диагностическую функцию (анализ окклюзии на моделях) и основную — воспроизводит движения нижней челюсти при изготовлении протеза."},{"id":"t7-19","topic":7,"n":19,"q":"Техника нанесения фарфорового покрытия предполагает использование:","opts":["опаковых масс","дентиновой массы","цементной массы","эмалевого слоя керамической массы","прозрачной керамической массы"],"key":[1,2,4,5],"multi":true,"ex":"Порядок слоёв: опаковый → дентинный → эмалевый → прозрачный (+ глазурь). «Цементной массы» в технике облицовки нет."},{"id":"t7-20","topic":7,"n":20,"q":"Под керамический мостовидный протез конечная линия препарирования зуба у края десны имеет форму:","opts":["«символа уступа»","уступа в виде ската под углом около 135°","прямого уступа под углом 90°","желобообразную","уступа со скошенным краем"],"key":[3,4],"multi":true,"ex":"Под керамику — прямой уступ 90° или желобообразный уступ. Скат под углом 135° и скошенный край — варианты для металлических краёв."},{"id":"t8-1","topic":8,"n":1,"q":"Что является причиной развития локального пародонтита?","opts":["повышение межальвеолярной высоты на искусственной коронке","отсутствие окклюзионного контакта искусственной коронки","отсутствие контактных пунктов"],"key":[3],"multi":false,"ex":"Без контактного пункта пища застревает между зубами и травмирует межзубный сосочек — развивается локальный пародонтит."},{"id":"t8-2","topic":8,"n":2,"q":"Укажите возможные осложнения при протезировании металлокерамическими мостовидными протезами с опорами на интактные зубы:","opts":["отлом культи зуба","расцементировка коронки","периодонтит"],"key":[3],"multi":false,"ex":"Препарирование живого зуба может привести к гибели пульпы, а затем к периодонтиту. Отлом культи характерен для депульпированных зубов (см. вопрос 17)."},{"id":"t8-3","topic":8,"n":3,"q":"При каких случаях возникает маргинальный гингивит?","opts":["при изготовлении короткой коронки","изготовлении коронки, не восстанавливающей экватор","изготовлении жакетной коронки"],"key":[2],"multi":false,"ex":"Экватор отводит пищевой комок от десны. Коронка без экватора — пища травмирует маргинальную десну."},{"id":"t8-4","topic":8,"n":4,"q":"Перегрузка опорных зубов и их преждевременная гибель может возникнуть:","opts":["при выборе опорных зубов и неправильной оценки их функциональных возможностей","выборе опорных зубов с пломбами","выборе опорных зубов с вкладками"],"key":[1],"multi":false,"ex":"Перегрузка — следствие неверной оценки функциональных возможностей опорных зубов (для этого и нужна одонтопародонтограмма)."},{"id":"t8-5","topic":8,"n":5,"q":"При повышенной стираемости зубов и снижении прикуса нельзя протезировать мостовидными протезами:","opts":["паяными","металлокерамическими","цельнокерамическими","цельнолитыми"],"key":[1],"multi":false,"ex":"При повышенной стираемости тонкие штампованные коронки паяных мостов быстро протираются; нужны литые или керамические конструкции."},{"id":"t8-6","topic":8,"n":6,"q":"Опасность пульпита при препарировании зубов можно уменьшить:","opts":["изменением скорости вращения инструмента","более точной центровкой инструмента","охлаждением зуба","непрерывным сошлифовыванием зуба"],"key":[1,2,3],"multi":true,"ex":"Риск пульпита снижают охлаждение, точная центровка бора (без биения) и прерывистое препарирование. Непрерывное сошлифовывание, наоборот, перегревает зуб."},{"id":"t8-7","topic":8,"n":7,"q":"Длинный край искусственной коронки приводит к образованию в пришеечной области:","opts":["вторичного кариеса","локализованного гингивита","маргинального пародонтита","клиновидного дефекта"],"key":[2,3],"multi":true,"ex":"Длинный край травмирует десну и круговую связку зуба: сначала локальный гингивит, затем маргинальный пародонтит."},{"id":"t8-8","topic":8,"n":8,"q":"Расцементировка коронки является следствием:","opts":["подвижности зуба","широкой коронки","нарушения правил приготовления цемента"],"key":[2,3],"multi":true,"ex":"Причины расцементировки: широкая, неплотно облегающая коронка и неправильно приготовленный цемент."},{"id":"t8-9","topic":8,"n":9,"q":"К возможным осложнениям при протезировании металлопластмассовыми мостовидными протезами относятся:","opts":["изменение цвета пластмассовых фасеток","стирание пластмассовых фасеток","быстрое стирание зубов-антагонистов","воспаление слизистой оболочки в месте контакта с пластмассой","чувство жжения в полости рта"],"key":[1,2,4,5],"multi":true,"ex":"Пластмасса меняет цвет, стирается, может раздражать слизистую (остаточный мономер — воспаление, жжение). Антагонисты быстро стирают твёрдые материалы, а не пластмасса."},{"id":"t8-10","topic":8,"n":10,"q":"Перегрев зуба, вибрация во время препарирования отрицательно действуют:","opts":["на твердые ткани зуба","пульпу зуба","периодонт зуба","ВНЧС","деятельность жевательных мышц"],"key":[1,2,3],"multi":true,"ex":"Перегрев и вибрация повреждают твёрдые ткани (микротрещины), пульпу и периодонт."},{"id":"t8-11","topic":8,"n":11,"q":"Повышение температуры зубных тканей во время препарирования зависит:","opts":["от возраста больного","диаметра режущего инструмента","скорости вращения инструмента","материала, из которого изготовлен инструмент","величины давления инструмента на зуб","температуры окружающей среды"],"key":[2,3,4,5],"multi":true,"ex":"Нагрев зависит от инструмента (диаметр, скорость вращения, материал) и силы давления на зуб."},{"id":"t8-12","topic":8,"n":12,"q":"Воспаление маргинального пародонта после фиксации искусственных коронок возможно вследствие:","opts":["отсутствия контакта с соседними зубами","глубокого погружения края коронок в десневые бороздки","толстого их края","отсутствия экватора","неплотного прилегания края коронок к шейкам зубов","отсутствия контакта коронок с зубами-антагонистами"],"key":[1,2,3,4,5],"multi":true,"ex":"Маргинальный пародонт воспаляется при отсутствии контактов, глубоком погружении края, толстом или неплотно прилегающем крае, отсутствии экватора."},{"id":"t8-13","topic":8,"n":13,"q":"«Металлический» вкус в полости рта у пациента после протезирования штампованно-паяным мостовидным протезом может появиться:","opts":["из-за наличия в припое цинка","наличия в припое меди, кадмия","нитрид-титанового покрытия протеза","наличия гингивита у пациента","заболевания печени"],"key":[1,2],"multi":true,"ex":"Металлический вкус вызывают гальванические токи и растворение компонентов припоя (цинк, медь, кадмий)."},{"id":"t8-14","topic":8,"n":14,"q":"Острые боли от температурных раздражителей под опорными коронками мостовидного протеза могут быть следствием:","opts":["обнажения шейки опорного зуба","пульпита в опорном зубе","глубоких пародонтальных карманов","большой протяженности мостовидного протеза"],"key":[1,2],"multi":true,"ex":"Боль от температурных раздражителей — признак обнажённой шейки опорного зуба или пульпита в нём."},{"id":"t8-15","topic":8,"n":15,"q":"Сколы керамической облицовки в мостовидном протезе могут быть:","opts":["при протезировании зубов с низкими клиническими коронками","большой протяженности мостовидного протеза","у пациентов молодого возраста","в мостовидных протезах, где есть суперконтакты","у пациентов с парафункциями жевательных мышц"],"key":[4,5],"multi":true,"ex":"Сколы — следствие перегрузки: суперконтакты и парафункции (например, бруксизм)."},{"id":"t8-16","topic":8,"n":16,"q":"При препарировании твердых тканей моляров с живой пульпой особую осторожность следует соблюдать:","opts":["на жевательной поверхности в области фиссур","вестибулярной поверхности в пришеечной области","контактных поверхностях в области экватора","оральной поверхности в пришеечной области","контактных поверхностях в пришеечной области","оральной поверхности в области экватора"],"key":[1,4,5],"multi":true,"ex":"Осторожность нужна там, где до пульпы близко или слой тканей тонкий: жевательная поверхность в области фиссур, а также оральная и контактные поверхности у шейки."},{"id":"t8-17","topic":8,"n":17,"q":"Укажите возможные осложнения при протезировании металлокерамическими мостовидными протезами с опорами на депульпированные зубы:","opts":["отлом культи зуба","расцементировка коронки","периодонтит","пульпит"],"key":[1,2,3],"multi":true,"ex":"Депульпированные зубы хрупкие: возможны отлом культи, расцементировка, периодонтит. Пульпит невозможен — пульпы нет."},{"id":"t8-18","topic":8,"n":18,"q":"Для предупреждения ошибок при протезировании мостовидными протезами необходимо:","opts":["тщательно выбирать конструкцию мостовидного протеза","собрать исчерпывающую информацию о состоянии здоровья пациента","назначить пациента на профилактические осмотры два раза в год"],"key":[1,2],"multi":true,"ex":"Профилактика ошибок — тщательное обследование пациента и обоснованный выбор конструкции."},{"id":"t8-19","topic":8,"n":19,"q":"К возможным недостаткам мостовидного протеза из нержавеющей стали относятся:","opts":["окисления припоя","низкая жевательная эффективность","возникновение микротоков","привкус металла в полости рта","быстрое стирание зубов-антагонистов"],"key":[1,3,4],"multi":true,"ex":"Недостатки стального паяного моста: окисление припоя, микротоки (гальванизм), металлический привкус."},{"id":"t8-20","topic":8,"n":20,"q":"Причины скола керамического покрытия:","opts":["загрязнение каркаса","выраженная конусность культи зуба, не восстановленная литым каркасом","невыверенные окклюзионные контакты","ошибки при обжиге и охлаждении керамической облицовки","неравномерная толщина керамического покрытия"],"key":[1,2,3,4,5],"multi":true,"ex":"Причины скола облицовки: загрязнение каркаса, недостаточная опора керамики (конусная культя без восстановления каркасом), невыверенная окклюзия, нарушения обжига и охлаждения, неравномерная толщина керамики."}]}</script>
<script>
(function(){
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent);
const Q = Object.fromEntries(DATA.questions.map(q => [q.id, q]));
const TOPIC = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
const EXAM_SIZE = 30, MASTER_STREAK = 2;
const app = document.getElementById('app'), bottom = document.getElementById('bottom'), bottomIn = document.getElementById('bottom-in');

/* ---------- storage (per-browser, optional) ---------- */
const NS = 'ortho-quiz-v1:';
function load(k, d){ try { const v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(NS + k, JSON.stringify(v)); } catch(e){} }
let seen = load('seen', {});          // id -> 1 (last answer correct) / 0
let mistakes = load('mistakes', {});  // id -> streak of correct answers since last error
let best = load('best', {});          // topicId -> best %
let settings = load('settings', {shuffle: true});

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
