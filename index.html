function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function plural(n, one, few, many){ const m10 = n % 10, m100 = n % 100; if(m10 === 1 && m100 !== 11) return one; if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const optLabel = (q, i) => (i + 1) + ') ' + q.opts[i];
function setBottom(buttons){
  bottomIn.innerHTML = '';
  if(!buttons){ bottom.hidden = true; return; }
  bottom.hidden = false;
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.primary ? ' primary' : '');
    el.textContent = b.text; el.disabled = !!b.disabled; el.id = b.id || '';
    el.addEventListener('click', b.onClick);
    bottomIn.appendChild(el);
  });
}
function top(){ window.scrollTo(0, 0); }

/* ---------- home ---------- */
function home(){
  session = null; setBottom(null);
  const total = DATA.questions.length;
  const known = DATA.questions.filter(q => seen[q.id] === 1).length;
  const nMist = Object.keys(mistakes).length;
  const nFlag = DATA.questions.filter(q => q.flag).length;
  let html = `
    <h1>Ортопедическая стоматология</h1>
    <p class="sub">Тренажёр по тестам: ${DATA.topics.length} тем, ${total} вопросов. После каждого ответа — пояснение и, где нужно, замечание к ключу.</p>
    <div class="stats">
      <div class="card stat"><b>${known}</b><span>из ${total} решены верно</span></div>
      <div class="card stat"><b>${nMist}</b><span>в работе над ошибками</span></div>
      <div class="card stat"><b>${Math.round(known / total * 100)}%</b><span>общий прогресс</span></div>
    </div>
    <div class="actions">
      <button class="btn primary" data-act="exam">Экзамен<small>${EXAM_SIZE} случайных вопросов из всех тем</small></button>
      <button class="btn" data-act="mist" ${nMist ? '' : 'disabled'}>Работа над ошибками<small>${nMist ? nMist + ' ' + plural(nMist, 'вопрос', 'вопроса', 'вопросов') + ' · вопрос уходит после 2 верных ответов подряд' : 'пока пусто — ошибки попадут сюда'}</small></button>
      <button class="btn" data-act="flags">Спорные места ключа<small>${nFlag} ${plural(nFlag, 'вопрос', 'вопроса', 'вопросов')} с замечаниями</small></button>
      <button class="btn" data-act="ref">Справочник<small>Все вопросы с ответами и пояснениями</small></button>
    </div>
    <h2>Темы</h2>
    <div class="topics">`;
  DATA.topics.forEach(t => {
    const qs = DATA.questions.filter(q => q.topic === t.id);
    const k = qs.filter(q => seen[q.id] === 1).length;
    const b = best[t.id];
    html += `<button class="card topic" data-topic="${t.id}">
        <div><div class="lbl">${esc(t.label)}</div><div class="ttl">${esc(t.title)}</div></div>
        <div class="meta">${k}/${qs.length}${b != null ? '<br>лучший: ' + b + '%' : ''}</div>
        <div class="bar"><i style="width:${Math.round(k / qs.length * 100)}%"></i></div>
      </button>`;
  });
  html += `</div>
    <div class="settings">
      <label><input type="checkbox" id="shuffle" ${settings.shuffle ? 'checked' : ''}> Перемешивать вопросы внутри темы</label>
      <button class="link-btn" id="reset">Сбросить прогресс</button>
    </div>
    <p class="footnote">Ответы засчитываются по ключу кафедры (выделенные варианты). Где ключ спорен, после ответа показано замечание с обоснованием. Прогресс хранится только в этом браузере.</p>`;
  app.innerHTML = html; top();
  app.querySelectorAll('[data-topic]').forEach(el => el.addEventListener('click', () => {
    const id = +el.dataset.topic; let ids = DATA.questions.filter(q => q.topic === id).map(q => q.id);
    if(settings.shuffle) ids = shuffle(ids);
    start(ids, {kind: 'topic', topic: id, title: TOPIC[id].label + '. ' + TOPIC[id].title});
  }));
  app.querySelector('[data-act="exam"]').addEventListener('click', () =>
    start(shuffle(DATA.questions.map(q => q.id)).slice(0, EXAM_SIZE), {kind: 'exam', title: 'Экзамен'}));
  app.querySelector('[data-act="mist"]').addEventListener('click', () =>
    start(shuffle(Object.keys(mistakes).filter(id => Q[id])), {kind: 'mist', title: 'Работа над ошибками'}));
  app.querySelector('[data-act="flags"]').addEventListener('click', () =>
    start(DATA.questions.filter(q => q.flag).map(q => q.id), {kind: 'flags', title: 'Спорные места ключа'}));
  app.querySelector('[data-act="ref"]').addEventListener('click', () => reference());
  app.querySelector('#shuffle').addEventListener('change', e => { settings.shuffle = e.target.checked; save('settings', settings); });
  app.querySelector('#reset').addEventListener('click', () => {
    if(confirmReset()) { seen = {}; mistakes = {}; best = {}; save('seen', seen); save('mistakes', mistakes); save('best', best); home(); }
  });
}
function confirmReset(){
  const b = document.getElementById('reset');
  if(b.dataset.armed) return true;
  b.dataset.armed = '1'; b.textContent = 'Нажмите ещё раз, чтобы сбросить'; setTimeout(() => { if(b.isConnected){ delete b.dataset.armed; b.textContent = 'Сбросить прогресс'; } }, 4000);
  return false;
}

/* ---------- quiz ---------- */
let session = null;
function start(ids, meta){
  if(!ids.length){ home(); return; }
  session = {ids, meta, i: 0, sel: [], checked: false, results: []};
  render();
}
function render(){
  const s = session, q = Q[s.ids[s.i]], t = TOPIC[q.topic];
  const n = s.ids.length;
  let html = `<div class="topbar"><div class="topbar-row">
      <button class="icon-btn" id="quit" aria-label="Выйти на главную">✕</button>
      <div class="progress" aria-hidden="true"><i style="width:${(s.i / n) * 100}%"></i></div>
      <div class="count">${s.i + 1} / ${n}</div></div></div>
    <article class="card qcard">
      <div class="qmeta"><span class="tag">${esc(t.label)}</span><span class="tag">вопрос ${q.n}</span>${q.flag && s.checked ? `<span class="tag warn">${q.flag.kind === 'dispute' ? 'спорный ключ' : 'есть нюанс'}</span>` : ''}</div>
      <p class="qtext">${esc(q.q)}</p>
      <p class="hint">${q.multi ? 'Выберите все правильные ответы' : 'Выберите один ответ'}</p>
      <div class="opts" role="group">`;
  q.opts.forEach((o, i) => {
    const k = i + 1, picked = s.sel.includes(k);
    let cls = 'opt' + (q.multi ? ' multi' : ''), mark = '';
    if(s.checked){
      const isKey = q.key.includes(k);
      if(isKey && picked){ cls += ' right'; mark = '✓'; }
      else if(isKey){ cls += ' missed'; mark = 'верно'; }
      else if(picked){ cls += ' wrong'; mark = '✗'; }
      if(q.flag && q.flag.kind === 'dispute' && q.flag.suggest && q.flag.suggest.includes(k) && !isKey) cls += ' suggest';
    }
    html += `<button class="${cls}" data-k="${k}" aria-pressed="${picked}" ${s.checked ? 'disabled' : ''}>
        <span class="num">${k}</span><span>${esc(o)}</span><span class="mark">${mark}</span></button>`;
  });
  html += `</div>`;
  if(s.checked) html += feedbackHTML(q, s.sel);
  html += `</article>`;
  app.innerHTML = html;
  app.querySelector('#quit').addEventListener('click', () => { if(s.results.length) results(); else home(); });
  app.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => toggle(+el.dataset.k)));
  if(!s.checked){
    setBottom([{text: 'Проверить', primary: true, disabled: !s.sel.length, id: 'go', onClick: check}]);
  } else {
    const last = s.i === s.ids.length - 1;
    setBottom([{text: last ? 'Результаты' : 'Далее', primary: true, id: 'go', onClick: next}]);
  }
}
function toggle(k){
  const s = session, q = Q[s.ids[s.i]];
  if(s.checked) return;
  if(q.multi) s.sel = s.sel.includes(k) ? s.sel.filter(x => x !== k) : s.sel.concat(k).sort((a, b) => a - b);
  else s.sel = [k];
  app.querySelectorAll('.opt').forEach(el => el.setAttribute('aria-pressed', s.sel.includes(+el.dataset.k)));
  const go = document.getElementById('go'); if(go) go.disabled = !s.sel.length;
}
function grade(q, sel){
  if(sameSet(sel, q.key)) return 'ok';
  return sel.some(k => q.key.includes(k)) && q.multi ? 'part' : 'bad';
}
function check(){
  const s = session, q = Q[s.ids[s.i]];
  if(!s.sel.length) return;
  s.checked = true;
  const g = grade(q, s.sel);
  s.results.push({id: q.id, sel: s.sel.slice(), g});
  if(g === 'ok'){
    seen[q.id] = 1;
    if(q.id in mistakes){ mistakes[q.id]++; if(mistakes[q.id] >= MASTER_STREAK) delete mistakes[q.id]; }
  } else {
    seen[q.id] = 0; mistakes[q.id] = 0;
  }
  save('seen', seen); save('mistakes', mistakes);
  render();
  const fb = app.querySelector('.feedback'); if(fb) fb.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function feedbackHTML(q, sel){
  const g = grade(q, sel);
  const v = g === 'ok' ? ['ok', 'Верно'] : g === 'part' ? ['part', 'Частично верно — засчитывается только полный ответ'] : ['bad', 'Неверно'];
  let h = `<div class="feedback"><p class="verdict ${v[0]}">${v[1]}</p>`;
  if(g !== 'ok') h += `<p class="ex" style="margin-bottom:6px"><b>Ответ по ключу:</b> ${q.key.map(k => esc(optLabel(q, k - 1))).join('; ')}</p>`;
  h += `<p class="ex">${esc(q.ex)}</p></div>`;
  if(q.flag) h += flagHTML(q);
  if(q.id in mistakes && g === 'ok') h += `<p class="hint" style="margin:10px 0 0">Работа над ошибками: ${mistakes[q.id]} из ${MASTER_STREAK} верных подряд.</p>`;
  return h;
}
function flagHTML(q){
  const f = q.flag;
  let h = `<div class="flag ${f.kind}"><b>${f.kind === 'dispute' ? 'Замечание к ключу' : 'Полезно знать'}</b><p>${esc(f.text)}</p>`;
  if(f.kind === 'dispute' && f.suggest) h += `<p class="sug">Вероятно, верно: ${f.suggest.map(k => esc(optLabel(q, k - 1))).join('; ')}</p>`;
  return h + `</div>`;
}
function next(){
  const s = session;
  if(s.i < s.ids.length - 1){ s.i++; s.sel = []; s.checked = false; render(); top(); }
  else results();
}

/* ---------- results ---------- */
function results(){
  const s = session; setBottom(null);
  const n = s.results.length, ok = s.results.filter(r => r.g === 'ok').length;
  const pct = n ? Math.round(ok / n * 100) : 0;
  if(s.meta.kind === 'topic' && n === s.ids.length){ best[s.meta.topic] = Math.max(best[s.meta.topic] || 0, pct); save('best', best); }
  const wrong = s.results.filter(r => r.g !== 'ok');
  const msg = pct >= 90 ? 'Отлично — тема усвоена.' : pct >= 70 ? 'Хорошо. Разберите ошибки ниже и повторите их.' : pct >= 50 ? 'Есть пробелы: пройдите работу над ошибками.' : 'Стоит перечитать пояснения в справочнике и пройти тему ещё раз.';
  let html = `<h1>${esc(s.meta.title)}</h1>
    <div class="card score"><div class="big">${ok} из ${n}</div><p>${pct}% верных ответов${n < s.ids.length ? ' · пройдено ' + n + ' из ' + s.ids.length : ''}</p><p>${msg}</p></div>`;
  if(wrong.length){
    html += `<h2>Ошибки (${wrong.length})</h2>`;
    wrong.forEach(r => {
      const q = Q[r.id];
      html += `<div class="card mistake"><p class="q">${esc(TOPIC[q.topic].label)}, вопрос ${q.n}. ${esc(q.q)}</p>
        <p class="row"><span>Ваш ответ:</span> ${r.sel.map(k => esc(optLabel(q, k - 1))).join('; ')}</p>
        <p class="row"><span>По ключу:</span> <b>${q.key.map(k => esc(optLabel(q, k - 1))).join('; ')}</b></p>
        <details><summary>Пояснение</summary><p class="ex">${esc(q.ex)}</p>${q.flag ? flagHTML(q) : ''}</details></div>`;
    });
  }
  app.innerHTML = html; top();
  const btns = [];
  if(wrong.length) btns.push({text: 'Повторить ошибки', primary: true, onClick: () => start(shuffle(wrong.map(r => r.id)), {kind: 'retry', title: 'Повтор ошибок'})});
  btns.push({text: 'На главную', primary: !wrong.length, onClick: home});
  setBottom(btns);
}

/* ---------- reference ---------- */
function reference(){
  setBottom([{text: 'На главную', onClick: home}]);
  let topic = 0, query = '';
  app.innerHTML = `<h1>Справочник</h1><p class="sub">Все вопросы с ответами по ключу и пояснениями.</p>
    <div class="toolbar"><input class="search" type="search" placeholder="Поиск по тексту вопроса или ответа" aria-label="Поиск">
    <div class="chips" role="group" aria-label="Фильтр по темам"></div></div><div id="list"></div>`;
  const chips = app.querySelector('.chips'), list = app.querySelector('#list');
  const opts = [{id: 0, label: 'Все'}].concat(DATA.topics.map(t => ({id: t.id, label: t.label})), [{id: -1, label: 'Спорные'}]);
  opts.forEach(o => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = o.label; b.dataset.id = o.id; chips.appendChild(b); });
  function draw(){
    chips.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', +c.dataset.id === topic));
    const ql = query.toLowerCase();
    const qs = DATA.questions.filter(q => (topic === 0 || (topic === -1 ? !!q.flag : q.topic === topic)) &&
      (!ql || (q.q + ' ' + q.opts.join(' ') + ' ' + q.ex).toLowerCase().includes(ql)));
    if(!qs.length){ list.innerHTML = '<p class="empty">Ничего не найдено</p>'; return; }
    list.innerHTML = qs.map(q => `<div class="card ref"><div class="qmeta"><span class="tag">${esc(TOPIC[q.topic].label)}</span><span class="tag">вопрос ${q.n}</span>${q.flag ? `<span class="tag warn">${q.flag.kind === 'dispute' ? 'спорный ключ' : 'нюанс'}</span>` : ''}</div>
      <p class="q">${esc(q.q)}</p><ol>${q.opts.map((o, i) => `<li class="${q.key.includes(i + 1) ? 'k' : ''}">${esc(o)}${q.key.includes(i + 1) ? ' ✓' : ''}</li>`).join('')}</ol>
      <p class="ex">${esc(q.ex)}</p>${q.flag ? flagHTML(q) : ''}</div>`).join('');
  }
  chips.addEventListener('click', e => { const c = e.target.closest('.chip'); if(!c) return; topic = +c.dataset.id; draw(); });
  app.querySelector('.search').addEventListener('input', e => { query = e.target.value.trim(); draw(); });
  draw(); top();
}

/* ---------- keyboard (desktop) ---------- */
document.addEventListener('keydown', e => {
  if(!session || !app.querySelector('.qcard') || e.target.matches('input')) return;
  if(/^[1-9]$/.test(e.key)){ const k = +e.key; if(k <= Q[session.ids[session.i]].opts.length) toggle(k); }
  else if(e.key === 'Enter'){ const go = document.getElementById('go'); if(go && !go.disabled){ e.preventDefault(); go.click(); } }
});

home();
})();
</script>
</body>
</html>
